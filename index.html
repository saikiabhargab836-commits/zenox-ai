
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENOX AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#030912;color:#00eaff;
font-family:Arial;text-align:center;
min-height:100vh;padding:25px 15px;
}
h1{letter-spacing:8px;text-shadow:0 0 20px #00eaff}
.circle{
width:190px;height:190px;border:3px solid #00eaff;
border-radius:50%;margin:45px auto;
box-shadow:0 0 30px #00eaff,inset 0 0 30px #00eaff;
display:flex;align-items:center;justify-content:center;
font-size:65px;animation:pulse 2s infinite;
}
@keyframes pulse{
50%{box-shadow:0 0 55px #00eaff,inset 0 0 40px #00eaff}
}
button{
background:#00eaff;color:#001018;border:0;
padding:15px 25px;border-radius:30px;
font-size:17px;font-weight:bold;margin:10px;
}
input{
width:90%;padding:15px;border-radius:25px;
border:1px solid #00eaff;background:#071522;
color:white;font-size:16px;
}
#reply{margin:25px auto;max-width:500px;line-height:1.6}
</style>
</head>
<body>
<h1>Z.E.N.O.X</h1>
<p>PERSONAL AI ASSISTANT</p>
<div class="circle">🤖</div>
<p id="status">SYSTEM ONLINE</p>
<input id="command" placeholder="Ask me anything...">
<br>
<button onclick="send()">SEND</button>
<button onclick="listen()">🎤 SPEAK</button>
<div id="reply">Hello Sir! I am Zenox. How can I help you?</div>

<script>
function speak(text) {
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "hi-IN";
  speech.rate = 0.9;
  speech.pitch = 0.8;

  let voices = speechSynthesis.getVoices();
  let hindiVoice = voices.find(v =>
    v.lang === "hi-IN" && /male|man/i.test(v.name)
  );

  if (hindiVoice) speech.voice = hindiVoice;

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}
function send(){
let q=document.getElementById("command").value.toLowerCase();
if(!q)return;
let answer="I am ZENOX. I am ready to help you, Sir.";
if(q.includes("hello")||q.includes("hi")||q.includes("नमस्ते"))
answer="Hello Sir! How are you today?";
else if(q.includes("time")||q.includes("समय"))
answer="The time is "+new Date().toLocaleTimeString();
else if(q.includes("date")||q.includes("तारीख"))
answer="Today's date is "+new Date().toLocaleDateString();
else if(q.includes("open youtube"))
{answer="Opening YouTube Sir.";window.open("https://youtube.com","_blank");}
else if(q.includes("open google"))
{answer="Opening Google Sir.";window.open("https://google.com","_blank");}
else if(q.includes("who are you"))
answer="I am ZENOX, your personal assistant.";
speak(answer);
}

function listen(){
let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Speech){speak("Speech recognition is not supported in this browser.");return;}
let r=new Speech();
r.lang="en-IN";
r.onstart=()=>document.getElementById("status").innerText="LISTENING...";
r.onresult=e=>{
document.getElementById("command").value=e.results[0][0].transcript;
send();
};
r.onerror=()=>document.getElementById("status").innerText="TRY AGAIN";
r.onend=()=>document.getElementById("status").innerText="SYSTEM ONLINE";
r.start();
}
</script>
</body>
</html>
