
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENOX AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#030912;color:#00eaff;
font-family:Arial;text-align:center;
min-height:100vh;padding:25px 15px;
}
h1{letter-spacing:8px;text-shadow:0 0 20px #00eaff}
.circle{
width:190px;height:190px;border:3px solid #00eaff;
border-radius:50%;margin:45px auto;
box-shadow:0 0 30px #00eaff,inset 0 0 30px #00eaff;
display:flex;align-items:center;justify-content:center;
font-size:65px;animation:pulse 2s infinite;
}
@keyframes pulse{
50%{box-shadow:0 0 55px #00eaff,inset 0 0 40px #00eaff}
}
button{
background:#00eaff;color:#001018;border:0;
padding:15px 25px;border-radius:30px;
font-size:17px;font-weight:bold;margin:10px;
}
input{
width:90%;padding:15px;border-radius:25px;
border:1px solid #00eaff;background:#071522;
color:white;font-size:16px;
}
#reply{margin:25px auto;max-width:500px;line-height:1.6}
</style>
</head>
<body>
<h1>Z.E.N.O.X</h1>
<p>PERSONAL AI ASSISTANT</p>
<div class="circle">🤖</div>
<p id="status">SYSTEM ONLINE</p>
<input id="command" placeholder="Ask me anything...">
<br>
<button onclick="send()">SEND</button>
<button onclick="listen()">🎤 SPEAK</button>
<div id="reply">Hello Sir! I am Zenox. How can I help you?</div>

<script>

let speechQueue = [];
let isSpeaking = false;

function speak(text) {
  if (!text) return;

  speechQueue.push(text);
  if (!isSpeaking) speakNext();
}

function speakNext() {
  if (speechQueue.length === 0) {
    isSpeaking = false;
    return;
  }

  isSpeaking = true;

  let speech = new SpeechSynthesisUtterance(speechQueue.shift());
  speech.lang = "hi-IN";
  speech.rate = 0.75;
  speech.pitch = 0.9;

  let voices = speechSynthesis.getVoices();
  let hindiVoice = voices.find(v => v.lang.toLowerCase() === "hi-in");

  if (hindiVoice) speech.voice = hindiVoice;

  speech.onend = function() {
    speakNext();
  };

  speech.onerror = function() {
    speakNext();
  };

  speechSynthesis.speak(speech);
}
  

async function send() {
  let input = document.getElementById("command");
  let message = input.value.trim();

  if (!message) return;

  document.getElementById("response").innerText = "ZENOX सोच रहा है...";

  let q = message.toLowerCase();
  let answer = "";

  if (q.includes("hello") || q.includes("hi") || q.includes("नमस्ते")) {
    answer = "नमस्ते Sir! मैं ZENOX हूँ। बताइए, मैं आपकी क्या मदद करूँ?";
  }
  else if (q.includes("time") || q.includes("समय")) {
    answer = "अभी समय है " + new Date().toLocaleTimeString();
  }
  else if (q.includes("date") || q.includes("तारीख")) {
    answer = "आज की तारीख है " + new Date().toLocaleDateString();
  }
  else if (q.includes("open youtube")) {
    answer = "YouTube खोल रहा हूँ Sir.";
    window.open("https://youtube.com", "_blank");
  }
  else if (q.includes("open google")) {
    answer = "Google खोल रहा हूँ Sir.";
    window.open("https://google.com", "_blank");
  }
  else if (q.includes("who are you")) {
    answer = "मैं ZENOX हूँ, आपका Personal AI Assistant.";
  }
  else {
    try {
      let response = await fetch(
        "https://zenox-ai-brains.richibhargab.workers.dev",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        }
      );

      let data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI request failed");
      }

      answer = data.reply || "मुझे जवाब नहीं मिल पाया।";
    }
    catch (error) {
      answer = "माफ़ कीजिए Sir, मेरा AI Brain अभी जवाब नहीं दे पा रहा है।";
      console.error(error);
    }
  }

  document.getElementById("response").innerText = answer;
  speak(answer);
}
  
  

function listen(){
let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Speech){speak("Speech recognition is not supported in this browser.");return;}
let r=new Speech();
r.lang="en-IN";
r.onstart=()=>document.getElementById("status").innerText="LISTENING...";
r.onresult=e=>{
document.getElementById("command").value=e.results[0][0].transcript;
send();
};
r.onerror=()=>document.getElementById("status").innerText="TRY AGAIN";
r.onend=()=>document.getElementById("status").innerText="SYSTEM ONLINE";
r.start();
}
</script>
  <div style="padding:20px;text-align:center;">
  <h2>ZENOX AI</h2>
  <input id="command" type="text" placeholder="Ask ZENOX anything..."
  style="width:90%;padding:12px;font-size:16px;">
  <button onclick="send()" style="padding:12px 25px;margin-top:10px;">
    Send
  </button>
    <div id="response" style="margin-top:15px;padding:12px;color:white;font-size:17px;">
  ZENOX is ready!
    </div>
  </div>
  <button onclick="listen()" style="padding:12px 25px;margin-top:10px;">
  🎤 Speak to ZENOX
  </button>
</body>
</html>
